name = "cant-sleep-feed"
main = "src/worker.js"
compatibility_date = "2025-01-01"
account_id = "1c19c252143c91371ba40fdad4e6551d"
workers_dev = true
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "litly.com", custom_domain = true },
  { pattern = "www.litly.com", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
# Run Worker first so canonical host redirects (www -> apex, workers.dev -> apex) execute on all paths
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "cant-sleep"
database_id = "c8e65fa7-16bc-477a-88ba-f416b03b5234"

# Photos attached to posts (deleted along with the post). Bucket created with:
#   npx wrangler r2 bucket create litly-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "litly-media"
