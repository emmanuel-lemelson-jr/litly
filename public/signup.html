<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join Litly</title>
  <meta name="description" content="Can't sleep? You're not alone. Join everyone who's up late. Choose to stay anonymous.">
  <link rel="canonical" href="https://litly.com/signup">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
  <link rel="stylesheet" href="/pills.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <link rel="preload" href="/sleepless.webp" as="image" type="image/webp" fetchpriority="high">
  <style>
    :root {
      --bg: #000; --tile: #161617; --text: #f5f5f7; --muted: #86868b; --hair: #2a2a2c;
      --accent: #869ad5; --link: #9bb0ed;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 17px/1.47 var(--font); letter-spacing: -.022em; -webkit-font-smoothing: antialiased; }
    a { color: var(--text); }

    .page { min-height: 100vh; display: grid; grid-template-columns: minmax(380px, 1fr) minmax(0, 1.15fr); }

    /* left: sign-up */
    .left { display: flex; flex-direction: column; padding: 28px clamp(24px, 6vw, 96px) 0; }
    .logo { display: inline-block; align-self: flex-start; }
    .logo img { height: 40px; width: auto; display: block; }
    .form { margin: auto 0; width: 100%; max-width: 420px; padding: 40px 0; }
    h1 { font-size: clamp(40px, 5.2vw, 68px); line-height: 1.02; font-weight: 700; letter-spacing: -.03em; margin: 0 0 14px; }
    h1 span { color: var(--accent); }
    .lede { color: var(--muted); font-size: 19px; line-height: 1.35; margin: 0 0 32px; }
    .sso { display: grid; gap: 12px; }
    .sso button {
      display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 52px;
      border: 0; border-radius: 980px; background: #fff; color: #0f1419; font: 600 17px var(--font); letter-spacing: -.02em;
      cursor: pointer; transition: background-color .15s, transform .1s;
    }
    .sso button:hover { background: #e8e8ed; }
    .sso button:active { transform: scale(.985); }
    .sso button:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; }
    .sso svg { width: 20px; height: 20px; flex: none; }
    .fine { color: #6e6e73; font-size: 13px; line-height: 1.45; margin: 16px 0 0; }
    .fine a { color: var(--text); font-weight: 600; text-decoration: none; }
    .fine a:hover { text-decoration: underline; color: var(--link); }
    .note { min-height: 22px; margin: 12px 4px 0; font-size: 14px; color: var(--accent); text-align: center; }
    footer { padding: 0 0 24px; color: #6e6e73; font-size: 12px; }

    /* right: mascot + live top posts */
    .right { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 0; }
    .right::before {
      content: ""; position: absolute; left: 50%; top: -8%; width: 80%; aspect-ratio: 1; transform: translateX(-50%);
      background: radial-gradient(closest-side, rgba(134,154,213,.28), rgba(134,154,213,.08) 55%, transparent 75%); pointer-events: none;
    }
    .mascot {
      position: relative; z-index: 1; width: clamp(240px, 24vw, 340px); height: auto; display: block; margin-bottom: -56px; pointer-events: none;
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 50%, rgba(0,0,0,.15) 78%, transparent 94%);
      mask-image: linear-gradient(to bottom, #000 0%, #000 50%, rgba(0,0,0,.15) 78%, transparent 94%);
    }
    /* one horizontal lane of cards drifting left, fading at both edges */
    .lane { position: relative; z-index: 2; width: 100%; overflow: hidden; margin-top: 8px;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 12%, #000 88%, transparent 100%); mask-image: linear-gradient(to right, transparent 0%, #000 12%, #000 88%, transparent 100%); }
    .cards { list-style: none; margin: 0; padding: 0; display: flex; width: max-content; animation: drift var(--dur, 40s) linear infinite; will-change: transform; }
    .lane:hover .cards { animation-play-state: paused; }
    @keyframes drift { to { transform: translateX(-50%); } }
    /* Cards mirror a feed post (avatar, name + time, text, X-style action row), just boxed for the carousel */
    .card { flex: none; width: 340px; display: grid; grid-template-columns: 40px 1fr; gap: 14px; padding: 16px 18px 6px; margin-right: 12px; border-radius: 20px; background: rgba(22,22,23,.82); border: 1px solid rgba(255,255,255,.06); }
    .card img { width: 40px; height: 40px; border-radius: 50%; }
    .card .who { display: flex; gap: 8px; align-items: baseline; font-size: 14px; color: var(--muted); }
    .card .who b { color: var(--text); font-weight: 600; }
    .card p { margin: 4px 0 0; font-size: 19px; line-height: 1.42; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .card .pills { pointer-events: none; }
    .cards-empty { color: var(--muted); text-align: center; padding: 20px 0; min-width: 340px; }

    @media (max-width: 860px) {
      .page { grid-template-columns: 1fr; }
      .right { display: none; }
      .left { padding: 20px 22px 0; min-height: 100vh; }
      .form { margin: auto; padding: 28px 0; max-width: 420px; text-align: center; }
      footer { padding-bottom: 20px; text-align: center; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .lane { overflow-x: auto; } }
  </style>
</head>
<body>
<div class="page">
  <section class="left">
    <a href="/" class="logo" aria-label="Litly home"><img src="/logo.svg" alt="Litly" width="130" height="40"></a>
    <div class="form">
      <h1>Can't sleep?<br><span>Vent about it.</span></h1>
      <p class="lede">Join everyone who's up late. Choose to stay anonymous.</p>
      <div class="sso">
        <button type="button" data-provider="google">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.45a5.5 5.5 0 0 1-2.39 3.62v3h3.87c2.27-2.09 3.57-5.17 3.57-8.81z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.93-2.91l-3.87-3c-1.07.72-2.45 1.15-4.06 1.15-3.12 0-5.77-2.11-6.71-4.94H1.29v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.29 14.3a7.2 7.2 0 0 1 0-4.6v-3.1H1.29a12 12 0 0 0 0 10.8l4-3.1z"/><path fill="#EA4335" d="M12 4.76c1.76 0 3.34.61 4.59 1.8l3.43-3.43C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.29 6.6l4 3.1C6.23 6.87 8.88 4.76 12 4.76z"/></svg>
          Continue with Google
        </button>
        <button type="button" data-provider="apple">
          <svg viewBox="0 0 814 1000" aria-hidden="true"><path fill="currentColor" d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76.5 0-103.7 40.8-165.9 40.8s-105.6-57-155.5-127C46.7 790.7 0 663 0 541.8c0-194.4 126.4-297.5 250.8-297.5 66.1 0 121.2 43.4 162.7 43.4 39.5 0 101.1-46 176.3-46 28.5 0 130.9 2.6 198.3 99.2zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z"/></svg>
          Continue with Apple
        </button>
      </div>
      <p class="fine">By continuing, you agree to our <a href="/terms">Terms of Service</a>, <a href="/privacy">Privacy Policy</a> and <a href="/privacy#cookies">Cookie Use</a>.</p>
      <p class="note" id="note" role="status"></p>
    </div>
    <footer>&copy; Litly &middot; Anonymous. Resets daily.</footer>
  </section>

  <section class="right" aria-label="What people are saying right now">
    <picture>
      <source srcset="/sleepless.webp" type="image/webp">
      <img class="mascot" src="/sleepless.gif" alt="Tired character lying awake in bed" width="400" height="376" fetchpriority="high">
    </picture>
    <div class="lane"><ul class="cards" id="cards"></ul></div>
  </section>
</div>

<script src="/avatars.js"></script>
<script src="/common.js"></script>
<script>
const $ = (id) => document.getElementById(id);
function card(p, serverNow) {
  const li = document.createElement("li");
  li.className = "card";
  const img = new Image(40, 40); img.alt = ""; img.src = avatarUri(p.avatar);
  const box = document.createElement("div");
  const who = document.createElement("div"); who.className = "who";
  const b = document.createElement("b"); b.textContent = p.username;
  const t = document.createElement("time"); t.textContent = ago(p.created_at, serverNow);
  who.append(b, t);
  const text = document.createElement("p"); text.textContent = p.body;
  // Same action row as the feed, decorative here (pointer-events off).
  const acts = document.createElement("div"); acts.className = "pills"; acts.setAttribute("aria-hidden", "true");
  for (const [icon, n] of [["heart", p.metoo], ["bubble", p.replies], ["share", 0]]) {
    const el = document.createElement("span"); el.className = "pill";
    el.innerHTML = ICON[icon] + '<span class="n"></span>';
    el.querySelector(".n").textContent = n || "";
    acts.append(el);
  }
  box.append(who, text, acts);
  li.append(img, box);
  return li;
}

let lastKey = "";
async function load() {
  try {
    const { posts, now } = await (await fetch("/api/top")).json();
    const key = posts.map((p) => `${p.id}:${p.metoo}:${p.replies}`).join();
    if (key === lastKey) return; // don't restart the drift when nothing changed
    lastKey = key;
    const ul = $("cards");
    if (!posts.length) { ul.style.animation = "none"; ul.innerHTML = '<li class="cards-empty">Nobody yet tonight. Be the first.</li>'; return; }
    // Repeat the set until one half is tall enough to fill the lane, then double it for a seamless loop.
    const half = [];
    while (half.length < 8) half.push(...posts);
    ul.style.animation = "";
    ul.style.setProperty("--dur", `${half.length * 7}s`);
    ul.replaceChildren(...half.map((p) => card(p, now)), ...half.map((p) => card(p, now)));
  } catch {}
}
load();
setInterval(load, 60000);

const ERRORS = {
  unavailable: "Sign-in isn't available right now.",
  cancelled: "Sign-in was cancelled.",
  failed: "Something went wrong signing in. Try again.",
};
const err = new URLSearchParams(location.search).get("error");
if (err) $("note").textContent = ERRORS[err] || ERRORS.failed;

document.querySelectorAll(".sso button").forEach((b) =>
  b.addEventListener("click", async () => {
    $("note").textContent = "";
    try {
      const res = await fetch("/api/auth/sign-in/social", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ provider: b.dataset.provider, callbackURL: "/", errorCallbackURL: "/signup?error=failed" }),
      });
      const data = await res.json();
      if (!data.url) throw new Error();
      try { localStorage.setItem("litly_pending", Date.now()); } catch {}
      location.href = data.url;
    } catch {
      $("note").textContent = ERRORS.unavailable;
    }
  })
);
</script>
</body>
</html>
