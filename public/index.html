<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Litly</title>
  <meta name="description" content="Can't sleep? You're not alone. Vent anonymously. Resets for everyone in 24h.">
  <link rel="canonical" href="https://litly.com">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2">
  <link rel="alternate icon" href="/favicon.ico?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">

  <!-- Open Graph / Facebook / LinkedIn / Discord / Slack / iMessage -->
  <meta property="og:site_name" content="Litly">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://litly.com">
  <meta property="og:title" content="Can't sleep?">
  <meta property="og:image" content="https://litly.com/og-v4.png">
  <meta property="og:image:secure_url" content="https://litly.com/og-v4.png">

  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Litly - Can't sleep? Vent about it.">
  <meta property="og:locale" content="en_US">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://litly.com">
  <meta name="twitter:title" content="Can't sleep?">
  <meta name="twitter:image" content="https://litly.com/og-v4.png">
  <meta name="twitter:image:alt" content="Litly - Can't sleep? Vent about it.">

  <link rel="preload" href="/sleepless.webp" as="image" type="image/webp" fetchpriority="high">
  <link rel="stylesheet" href="/nav.css">
  <link rel="stylesheet" href="/pills.css">
  <style>
    :root {
      --bg: #000;
      --tile: #161617;
      --text: #f5f5f7;
      --muted: #86868b;
      --hair: #2a2a2c;
      --accent: #869ad5;
      --accent-hover: #9bb0ed;
      --accent-ink: #060913;
      --link: #9bb0ed;
      --err: #ff453a;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.47 var(--font); letter-spacing: -.022em; -webkit-font-smoothing: antialiased; }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

    /* hero */
    .hero { text-align: center; }
    .hero-pic { display: contents; }
    .hero-gif {
      display: block;
      width: clamp(200px, 17vw, 270px);
      height: auto;
      margin: 0 auto -22px;
      position: relative;
      z-index: 1;
      pointer-events: none;
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 44%, rgba(0,0,0,0.15) 75%, transparent 92%);
      mask-image: linear-gradient(to bottom, #000 0%, #000 44%, rgba(0,0,0,0.15) 75%, transparent 92%);
    }
    .sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    /* countdown */
    .clock { margin: 18px 0 2px; font-size: clamp(38px, 3.6vw, 52px); font-weight: 200; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .clock-cap { color: var(--muted); font-size: 14px; margin: 0; }

    /* home layout: globe | feed | mascot + timer. The feed starts right under the header; the side
       panels stay put while it scrolls. Below 1180px it is just the feed, with a one-line timer. */
    .home { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 640px) minmax(0, 1fr); gap: 40px; max-width: 1440px; margin: 0 auto; padding: 0 28px; }
    .center { min-width: 0; padding-top: 24px; }
    .side { position: sticky; top: 80px; align-self: start; padding-top: 24px; min-width: 0; text-align: center; }
    .globe { display: block; width: min(100%, 420px); aspect-ratio: 1; margin: 0 auto; cursor: grab; touch-action: pan-y; }
    .side-cap { color: var(--muted); font-size: 14px; margin: 0; }
    .side-cap b { color: var(--text); font-weight: 600; }
    @media (max-width: 1179px) {
      /* phones/tablets: the sleepy character and timer sit above the composer; the globe is hidden */
      .home { display: flex; flex-direction: column; max-width: 680px; padding: 0 22px; gap: 0; }
      .globe-side { display: none; }
      .hero-side { position: static; order: -1; padding-top: 12px; align-self: stretch; width: 100%; }
      .center { padding-top: 20px; }
    }

    /* composer */
    .composer { margin: 0; }
    .box { background: var(--tile); border-radius: 20px; padding: 16px 18px 12px; transition: background-color .2s; }
    .box:focus-within { background: #1c1c1e; }
    textarea {
      display: block; width: 100%; border: 0; outline: 0; resize: none; background: transparent;
      color: var(--text); font: 19px/1.38 var(--font); letter-spacing: -.02em; padding: 0;
      height: auto; min-height: 27px; max-height: 260px;
      field-sizing: content;
      overflow-y: auto;
    }
    textarea:placeholder-shown { height: 27px; overflow: hidden; }
    textarea::placeholder { color: #6e6e73; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
    .attach { display: inline-grid; place-items: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%; background: #2c2c2e; color: var(--text); cursor: pointer; transition: background-color .2s; }
    .attach svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .attach:hover:not(:disabled) { background: #3a3a3c; }
    .attached { position: relative; width: fit-content; margin: 12px 0 0; }
    .attached img { display: block; max-width: 100%; max-height: 220px; border-radius: 14px; }
    .attached button { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border: 0; border-radius: 50%; background: rgba(0,0,0,.7); color: #fff; font: 600 16px/1 var(--font); cursor: pointer; }
    .attached button:hover { background: rgba(0,0,0,.9); }
    .composer.out .box { cursor: pointer; }
    .attach:disabled { color: #6e6e73; cursor: default; }
    .attach:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
    .right { display: flex; align-items: center; gap: 14px; }
    .count { font-size: 13px; color: #6e6e73; font-variant-numeric: tabular-nums; }
    .btn {
      border: 0; cursor: pointer; background: var(--accent); color: var(--accent-ink); font: 500 17px var(--font); letter-spacing: -.02em;
      padding: 9px 22px; border-radius: 980px; transition: background-color .2s;
    }
    .btn:hover:not(:disabled) { background: var(--accent-hover); }
    .btn:disabled { background: #2c2c2e; color: #6e6e73; cursor: default; }
    .btn:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; }
    .msg { min-height: 20px; margin: 8px 4px 0; font-size: 14px; color: var(--muted); text-align: center; }
    .msg.err { color: var(--err); }
    .msg:empty { display: none; }

    /* feed */
    .feed { margin: 4px 0 0; padding: 0 0 120px; }

    footer { text-align: center; color: #6e6e73; font-size: 12px; padding: 0 22px 40px; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<nav><div class="in"><a href="/" class="nav-logo" aria-label="Litly"><img src="/logo.svg" alt="Litly" width="130" height="40"></a><div class="nav-auth" id="nav-auth"><a class="nav-btn" href="/signup">Log in</a></div></div></nav>
<script src="/nav.js"></script>

<main class="home">
  <aside class="side globe-side" aria-label="Where people are up right now">
    <canvas class="globe" id="globe" role="img" aria-label="Globe showing the countries visitors come from; pulsing ones have someone awake right now"></canvas>
    <p class="side-cap">Awake around the world</p>
  </aside>

  <div class="center">
  <section class="composer">
    <form id="post-form" class="box" enctype="multipart/form-data">
      <label for="body" class="hp">Your post</label>
      <textarea id="body" name="body" rows="1" maxlength="500" placeholder=""></textarea>
      <div class="hp" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></div>
      <input type="file" id="file" accept="image/*" hidden>
      <div class="attached" id="attached" hidden><img id="attached-img" alt="Photo you're attaching"><button type="button" id="attached-x" aria-label="Remove photo">&times;</button></div>
      <div class="bar">
        <button type="button" class="attach" id="attach" aria-label="Attach a photo" title="Attach a photo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg></button>
        <div class="right"><span class="count" id="count"></span><button class="btn" id="post-btn" type="submit" disabled>Post</button></div>
      </div>
    </form>
    <p class="msg" id="post-msg" role="status"></p>
  </section>

  <section class="feed">
    <ul id="list" class="plist" aria-live="polite"></ul>
    <p class="empty" id="empty" hidden>No one yet. Be the first.</p>
  </section>
  </div>

  <aside class="side hero-side">
  <section class="hero">
    <picture class="hero-pic">
      <source srcset="/sleepless.webp" type="image/webp">
      <img class="hero-gif" src="/sleepless.gif" alt="Tired character lying awake in bed" width="400" height="376" fetchpriority="high">
    </picture>
    <h1 class="sr">Can't sleep? You're not alone. Vent anonymously.</h1>
    <div class="clock" id="clock" role="timer" aria-label="Time until reset">--:--:--</div>
    <p class="clock-cap" id="clock-cap">until the feed resets</p>
  </section>
  </aside>
</main>

<footer>Anonymous. Resets daily. &middot; <a href="/terms" style="color:inherit">Terms</a> &middot; <a href="/privacy" style="color:inherit">Privacy</a></footer>

<script src="/avatars.js"></script>
<script src="/common.js"></script>
<script src="/land.js"></script>
<script src="/centroids.js"></script>
<script src="/globe.js"></script>
<script>initGlobe(document.getElementById("globe"));</script>
<script>
const $ = (id) => document.getElementById(id);
// null = signed out, undefined = not known yet. A cached profile avoids a signed-out flash on load.
let me;
try { me = JSON.parse(localStorage.getItem("litly_me") || "null") || undefined; } catch {}

let skew = 0, resetAt = null, seen = new Set(), first = true;
const now = () => Date.now() + skew;
const pad = (n) => String(n).padStart(2, "0");

function tick() {
  if (!resetAt) return;
  let left = resetAt - now();
  if (left <= 0) { left = 0; load(); }
  const h = Math.floor(left / 3600000), m = Math.floor(left / 60000) % 60, s = Math.floor(left / 1000) % 60;
  $("clock").textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
}
setInterval(tick, 1000);

const render = (p) => postCard(p, { now: now(), enter: !first && !seen.has(p.id), me, onDelete: () => { $("empty").hidden = $("list").children.length > 0; } });

async function load() {
  try {
    const { posts, now: srv, resetAt: r } = await (await fetch("/api/posts")).json();
    skew = srv - Date.now();
    if (r !== resetAt) {
      resetAt = r;
      const at = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit", timeZoneName: "short" }).format(r);
      $("clock-cap").textContent = `until the feed resets at ${at}`;
    }
    tick();
    $("list").replaceChildren(...posts.map(render));
    posts.forEach((p) => seen.add(p.id));
    first = false;
    $("empty").hidden = posts.length > 0;
  } catch { /* keep last render */ }
}

const body = $("body");
function adjustHeight() {
  if (body.value.length === 0) {
    body.style.height = "";
    return;
  }
  if (window.CSS && CSS.supports && CSS.supports("field-sizing", "content")) return;
  body.style.height = "auto";
  body.style.height = Math.min(body.scrollHeight, 260) + "px";
}

const NARROW = window.matchMedia && window.matchMedia("(max-width: 520px)").matches;
const PREFIX = NARROW ? "Up late: " : "Up late because ";
const PHRASES = [
  "my mind races…",
  "too much coffee…",
  "replaying 2019…",
  "a 2 AM idea…",
  "overthinking…",
  "tomorrow…",
  "warm pillows…",
  "I can't unwind…"
];

const prefersReducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if (prefersReducedMotion) {
  body.placeholder = NARROW ? "Up late…" : "Up late because…";
}

let isInitial = true;
let phraseIdx = 0;
let charIdx = 0;
let isDeleting = false;
let typeTimer = null;
let isPaused = false;

function stepTyping() {
  if (isPaused || body.value.length > 0) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    body.placeholder = "Up late because…";
    return;
  }

  if (isInitial) {
    const initialText = PREFIX + PHRASES[0];
    charIdx++;
    body.placeholder = initialText.slice(0, charIdx);
    if (charIdx >= initialText.length) {
      isInitial = false;
      isDeleting = true;
      charIdx = PHRASES[0].length;
      typeTimer = setTimeout(stepTyping, 2400);
      return;
    }
    typeTimer = setTimeout(stepTyping, 40 + Math.random() * 25);
    return;
  }

  const currentPhrase = PHRASES[phraseIdx];
  if (!isDeleting) {
    charIdx++;
    body.placeholder = PREFIX + currentPhrase.slice(0, charIdx);
    if (charIdx >= currentPhrase.length) {
      isDeleting = true;
      typeTimer = setTimeout(stepTyping, 2400);
      return;
    }
    typeTimer = setTimeout(stepTyping, 40 + Math.random() * 25);
  } else {
    charIdx--;
    body.placeholder = PREFIX + currentPhrase.slice(0, charIdx);
    if (charIdx <= 0) {
      isDeleting = false;
      phraseIdx = (phraseIdx + 1) % PHRASES.length;
      typeTimer = setTimeout(stepTyping, 450);
      return;
    }
    typeTimer = setTimeout(stepTyping, 22);
  }
}

function startTyping() {
  clearTimeout(typeTimer);
  isPaused = false;
  stepTyping();
}

function stopTyping() {
  clearTimeout(typeTimer);
  isPaused = true;
}

body.addEventListener("input", () => {
  adjustHeight();
  const n = body.value.trim().length;
  $("count").textContent = body.value.length > 400 ? 500 - body.value.length : "";
  updatePostBtn();
  if (body.value.length === 0) {
    body.placeholder = PREFIX;
    charIdx = 0;
    isDeleting = false;
    typeTimer = setTimeout(startTyping, 800);
  } else {
    isInitial = false;
    stopTyping();
  }
});

// ---- who can post: signed-in people only ----
let photo = null; // { blob, w, h } already shrunk in the browser
function updatePostBtn() {
  const loggedOut = me === null;
  $("post-btn").textContent = loggedOut ? "Log in to post" : "Post";
  $("post-btn").disabled = loggedOut ? false : body.value.trim().length < 3 && !photo;
}
const goSignup = () => { location.href = "/signup"; };
function applyAuth(m) {
  me = m;
  document.querySelector(".composer").classList.toggle("out", m === null);
  body.readOnly = m === null;
  updatePostBtn();
  if ($("list").children.length) load(); // redraw so your own posts get their delete button
}
litlyMe.then((m) => { if (m !== undefined) applyAuth(m); });
// Signed out: tapping the box, the photo button or the button sends you to sign in.
$("post-form").addEventListener("click", (e) => { if (me === null && !e.target.closest("#post-btn")) goSignup(); });

// ---- photo: shrink to <=1600px and re-encode (also drops location data) before uploading ----
const MAX_SIDE = 1600;
async function shrink(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const k = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  c.getContext("2d").drawImage(bmp, 0, 0, w, h);
  bmp.close && bmp.close();
  let blob = await new Promise((r) => c.toBlob(r, "image/webp", 0.82));
  if (!blob || blob.type !== "image/webp") blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85)); // Safari can't encode WebP
  return { blob, w, h };
}
function clearPhoto() {
  if (photo) URL.revokeObjectURL($("attached-img").src);
  photo = null; $("attached").hidden = true; $("file").value = ""; updatePostBtn();
}
$("attach").addEventListener("click", () => { if (me === null) goSignup(); else $("file").click(); });
$("attached-x").addEventListener("click", clearPhoto);
$("file").addEventListener("change", async () => {
  const f = $("file").files[0];
  if (!f) return;
  const msg = $("post-msg"); msg.textContent = ""; msg.classList.remove("err");
  try {
    clearPhoto();
    photo = await shrink(f);
    if (photo.blob.size > 3 * 1024 * 1024) throw new Error("That photo is too big.");
    $("attached-img").src = URL.createObjectURL(photo.blob);
    $("attached").hidden = false; updatePostBtn();
  } catch (err) {
    photo = null; msg.textContent = err.message === "That photo is too big." ? err.message : "Couldn't read that photo."; msg.classList.add("err");
  }
});

$("post-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (me === null) return goSignup();
  const btn = $("post-btn"), msg = $("post-msg");
  btn.disabled = true; msg.textContent = ""; msg.classList.remove("err");
  const fd = new FormData(e.target);
  fd.delete("image");
  if (photo) { fd.set("image", photo.blob, photo.blob.type === "image/webp" ? "photo.webp" : "photo.jpg"); fd.set("image_w", photo.w); fd.set("image_h", photo.h); }
  try {
    const res = await fetch("/api/posts", { method: "POST", body: fd });
    const data = await res.json();
    if (res.status === 401) return goSignup();
    if (!res.ok) throw new Error(data.error || "Couldn't post.");
    e.target.reset(); $("count").textContent = ""; adjustHeight(); clearPhoto();
    isInitial = false;
    charIdx = 0;
    isDeleting = false;
    body.placeholder = PREFIX;
    typeTimer = setTimeout(startTyping, 1200);
    msg.textContent = "Posted. You're not the only one.";
    await load();
    $("list").firstElementChild?.scrollIntoView({ behavior: "smooth", block: "center" });
  } catch (err) {
    msg.textContent = err.message; msg.classList.add("err"); updatePostBtn();
  }
});

adjustHeight();
if (!prefersReducedMotion) {
  typeTimer = setTimeout(startTyping, 200);
}

load();
setInterval(load, 20000);
</script>
</body>
</html>
